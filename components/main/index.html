<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Autofrontcam</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
  font-family:Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#stream{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ov{position:fixed;inset:0;width:100%;height:100%}
#stage{position:fixed;inset:0;transform-origin:center center}
#ver{position:fixed;top:10px;left:10px;color:#aaa;font:12px monospace;
  text-shadow:0 0 4px #000;background:rgba(0,0,0,0.4);padding:3px 8px;border-radius:6px;
  z-index:20;pointer-events:none}
#volt{position:fixed;top:10px;right:10px;color:#0f0;font:bold 16px monospace;
  text-shadow:0 0 4px #000;background:rgba(0,0,0,0.5);padding:5px 10px;border-radius:6px;
  z-index:20;pointer-events:none}
#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);color:#ccc;
  font:13px sans-serif;text-shadow:0 0 3px #000;background:rgba(0,0,0,0.5);
  padding:5px 12px;border-radius:14px;z-index:20;pointer-events:none;display:none}
#busy{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ffcc00;
  font:bold 18px sans-serif;text-align:center;text-shadow:0 0 6px #000;
  background:rgba(0,0,0,0.75);padding:16px 24px;border:1px solid #ffcc00;
  border-radius:12px;z-index:25;display:none;pointer-events:none}
#menu{position:fixed;inset:0;display:none;z-index:10}
#menu.show{display:block}
#ctrl{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px}
.btn{width:56px;height:56px;font-size:26px;color:#fff;background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.45);border-radius:12px;display:flex;
  align-items:center;justify-content:center;cursor:pointer}
.btn:active{background:rgba(0,0,0,0.85)}
#panel{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:180px;
  background:rgba(0,0,0,0.72);border:1px solid rgba(255,255,255,0.3);border-radius:12px;
  padding:14px;color:#eee;font:13px sans-serif}
#panel h3{margin:0 0 10px;font-size:14px;color:#ffd}
#panel label{display:block;margin:8px 0 3px}
#panel input[type=range]{width:100%}
#panel select,#panel input[type=number]{width:100%;padding:4px;border-radius:4px;border:none;box-sizing:border-box}
#panel .chk{display:flex;align-items:center;gap:6px;margin-top:10px}
#otaBtn{position:absolute;left:12px;bottom:12px;padding:12px 20px;
  background:rgba(40,120,220,0.85);color:#fff;border:none;border-radius:10px;
  font-size:15px;cursor:pointer}
#otaBtn:active{background:rgba(30,90,170,0.95)}
#lineSel{display:flex;gap:6px;margin-bottom:8px}
#lineSel button{flex:1;padding:6px;border-radius:6px;border:1px solid #555;
  background:rgba(255,255,255,0.1);color:#ccc;font-size:12px;cursor:pointer}
#lineSel button.active{background:#fff;color:#000}
</style>
</head>
<body>
<div id="stage">
  <img id="stream" alt="stream">
  <canvas id="ov"></canvas>
</div>
<div id="ver"></div>
<div id="volt">--.-V</div>
<div id="busy">⚠ Anderes Gerät<br>empfängt den Stream</div>
<div id="hint">Tippe auf den Bildschirm für Menü</div>

<div id="menu">
  <input type="file" id="fileInput" accept=".bin" style="display:none">
  <div id="ctrl">
    <div class="btn" id="bLeft">◀</div>
    <div class="btn" id="bRight">▶</div>
    <div class="btn" id="bRotL">↺</div>
    <div class="btn" id="bRotR">↻</div>
  </div>
  <div id="panel">
    <h3>Einstellungen</h3>
    <div id="lineSel">
      <button id="selRed" class="active">Rot</button>
      <button id="selYellow">Gelb</button>
    </div>
    <label>X-Position</label>
    <input type="range" id="xRange" min="0" max="100" step="1">
    <label>Winkel</label>
    <input type="range" id="aRange" min="-45" max="45" step="1">
    <label>Dicke</label>
    <input type="range" id="wRange" min="1" max="15" step="1">
    <label>Bild drehen (°)</label>
    <input type="range" id="rotRange" min="-180" max="180" step="1">
    <label>Modus</label>
    <select id="modeSel">
      <option value="0">Dauerbetrieb</option>
      <option value="1">Geregelt</option>
    </select>
    <label>Grenzwert (V)</label>
    <input type="number" id="thresh" min="6" max="14.5" step="0.1">
  </div>
  <button id="otaBtn">OTA</button>
</div>

<script>
(function(){
  var img=document.getElementById('stream');
  var cv=document.getElementById('ov');
  var ctx=cv.getContext('2d');
  var stage=document.getElementById('stage');
  var volt=document.getElementById('volt');
  var menu=document.getElementById('menu');
  var hint=document.getElementById('hint');
  var busy=document.getElementById('busy');

  /* ===== Bilddrehung: gesamten Stage (Bild + Overlay) drehen =====
   * Winkel kommt vom Server (NVS), angewendet als CSS-Transform.
   * Touch-Koordinaten werden zurueckgedreht, damit Ziehen/Drehen der
   * Linien im ungedrehten Canvas-Koordinatensystem funktioniert. */
  var rot=0;
  function applyRot(){
    stage.style.transform='rotate('+rot+'deg)';
  }
  /* Viewport-Koordinate in Canvas-Koordinate umrechnen (Rotation rueckgaengig) */
  function toCanvas(x,y){
    if(!rot) return {x:x,y:y};
    var cx=cv.width/2, cy=cv.height/2;
    var rad=-rot*Math.PI/180;
    var dx=x-cx, dy=y-cy;
    return {x:cx+dx*Math.cos(rad)-dy*Math.sin(rad),
            y:cy+dx*Math.sin(rad)+dy*Math.cos(rad)};
  }

  /* ===== Stream-Client =====
   * iOS Safari rendert multipart/x-mixed-replace im <img> nicht zuverlaessig.
   * Daher holt die Web-UI Einzelbilder per /capture vom gleichen Server
   * (Port 80, gleicher Origin -> kein CORS, kein Blocking). ~8-10 fps. */
  var streamBusy=false;
  var streamXHR=null;
  var streamTimer=null;
  var lastUrl=null;
  var streamLastOk=0;

  function showFrame(blob){
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl=URL.createObjectURL(blob);
    img.src=lastUrl;
  }

  function pollFrame(){
    if(streamBusy) return;      /* laufender Request -> nicht stapeln */
    streamBusy=true;
    var x=new XMLHttpRequest();
    streamXHR=x;
    /* Cache-Busting, damit iOS nicht die alte Antwort liefert */
    x.open('GET','/capture?r='+Date.now(),true);   /* gleicher Server (Port 80) */
    x.responseType='blob';
    x.timeout=4000;
    x.onloadend=function(){     /* feuert IMMER (Erfolg/Fehler/Timeout) */
      streamBusy=false;
      streamXHR=null;
      if(x.status===200&&x.response&&x.response.size>0){
        streamLastOk=Date.now();
        busy.style.display='none';
        showFrame(x.response);
      } else if(x.status===503){
        busy.style.display='block';   /* anderes Geraet bedient den Stream */
      }
      schedule();
    };
    x.send();
  }

  function schedule(){
    clearTimeout(streamTimer);
    streamTimer=setTimeout(pollFrame,200);   /* ~5fps reichen fuer die Fahrzeugkante */
  }

  /* Watchdog: falls die Kette irgendwo haengt (z.B. iOS stoppt onloadend),
   * den Request abbrechen und neu starten. */
  setInterval(function(){
    if(Date.now()-streamLastOk>5000){
      if(streamXHR){ try{streamXHR.abort();}catch(e){} }
      if(streamBusy) streamBusy=false;
      clearTimeout(streamTimer);
      schedule();
    }
  },2000);

  pollFrame();

  var cfg={voltage:0,mode:0,threshold:12.8,version:'',build:0,
    portrait:{red:{x:50,angle:0,w:3,on:1},yellow:{x:60,angle:0,w:3,on:1}},
    landscape:{red:{x:50,angle:0,w:3,on:1},yellow:{x:60,angle:0,w:3,on:1}}};
  var sel='red';
  var drag=null;

  function isPortrait(){return window.innerHeight>window.innerWidth;}
  function activeSet(){return isPortrait()?cfg.portrait:cfg.landscape;}
  function line(c){return activeSet()[c];}

  function sizeCanvas(){
    cv.width=img.clientWidth;
    cv.height=img.clientHeight;
    draw();
  }
  window.addEventListener('resize',function(){sizeCanvas();syncSliders();});
  window.addEventListener('orientationchange',function(){
    setTimeout(function(){sizeCanvas();syncSliders();},300);
  });

  function draw(){
    var w=cv.width,h=cv.height;
    if(!w||!h)return;
    ctx.clearRect(0,0,w,h);
    var s=activeSet();
    drawOne(s.red,'#ff2a2a');
    drawOne(s.yellow,'#ffe600');
  }
  function drawOne(c,a){
    if(!c.on)return;
    var w=cv.width,h=cv.height;
    var cx=c.x/100*w, cy=h/2;
    var rad=c.angle*Math.PI/180, half=h/2;
    var x1=cx+half*Math.sin(rad), y1=cy-half*Math.cos(rad);
    var x2=cx-half*Math.sin(rad), y2=cy+half*Math.cos(rad);
    ctx.strokeStyle=a;ctx.lineWidth=c.w;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if(menu.classList.contains('show')){
      var r=Math.max(8,c.w+5);
      ctx.fillStyle=a;
      ctx.beginPath();ctx.arc(x1,y1,r,0,6.2832);ctx.fill();
      ctx.beginPath();ctx.arc(x2,y2,r,0,6.2832);ctx.fill();
    }
  }

  function lineEnds(c){
    var w=cv.width,h=cv.height;
    var cx=c.x/100*w, cy=h/2, rad=c.angle*Math.PI/180, half=h/2;
    return {x1:cx+half*Math.sin(rad),y1:cy-half*Math.cos(rad),
            x2:cx-half*Math.sin(rad),y2:cy+half*Math.cos(rad)};
  }
  function distToLine(c,x,y){
    var e=lineEnds(c);
    var dx=e.x2-e.x1,dy=e.y2-e.y1;
    var t=((x-e.x1)*dx+(y-e.y1)*dy)/(dx*dx+dy*dy);
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(x-(e.x1+t*dx),y-(e.y1+t*dy));
  }

  function onStart(x,y){
    if(!menu.classList.contains('show'))return;
    var cand=[];
    ['red','yellow'].forEach(function(k){
      var c=line(k);
      if(!c.on)return;
      var e=lineEnds(c);
      if(Math.hypot(x-e.x1,y-e.y1)<30)cand.push({line:k,type:'rot'});
      else if(distToLine(c,x,y)<24)cand.push({line:k,type:'move'});
    });
    if(cand.length){
      drag=cand[0];
      drag.startX=x;drag.startY=y;
      drag.startCx=line(drag.line).x;
      drag.startAngle=line(drag.line).angle;
    }
  }
  function onMove(x,y){
    if(!drag)return;
    var c=line(drag.line);
    if(drag.type==='move'){
      var dx=(x-drag.startX)/cv.width*100;
      c.x=Math.max(0,Math.min(100,drag.startCx+dx));
    }else{
      var e=lineEnds(c);
      var ang=Math.atan2(y-e.y1,x-e.x1)*180/Math.PI-90;
      c.angle=Math.max(-45,Math.min(45,ang));
    }
    draw();syncSliders();saveDebounced();
  }
  function onEnd(){
    if(drag){drag=null;save();}
  }

  var touchMoved=false;
  cv.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];var p=toCanvas(t.clientX,t.clientY);onStart(p.x,p.y);touchMoved=false;},{passive:false});
  cv.addEventListener('touchmove',function(e){e.preventDefault();touchMoved=true;var t=e.touches[0];var p=toCanvas(t.clientX,t.clientY);onMove(p.x,p.y);},{passive:false});
  cv.addEventListener('touchend',function(e){e.preventDefault();var wasDrag=!!drag;onEnd();if(!wasDrag&&!touchMoved){onTap();}},{passive:false});
  cv.addEventListener('touchcancel',function(e){e.preventDefault();onEnd();},{passive:false});
  cv.addEventListener('mousedown',function(e){var p=toCanvas(e.clientX,e.clientY);onStart(p.x,p.y);});
  window.addEventListener('mousemove',function(e){if(drag){var p=toCanvas(e.clientX,e.clientY);onMove(p.x,p.y);}});
  window.addEventListener('mouseup',onEnd);

  function onTap(){
    if(drag)return;
    if(menu.classList.contains('show')){
      menu.classList.remove('show');hint.style.display='none';
    }else{
      menu.classList.add('show');
      hint.style.display='block';
      setTimeout(function(){hint.style.display='none';},2500);
    }
    draw();
  }
  cv.addEventListener('click',function(e){e.preventDefault();onTap();});
  /* Menü schliessen bei Tipp auf freie Stelle (nicht Button/Panel) */
  menu.addEventListener('click',function(e){
    if(e.target===menu){menu.classList.remove('show');hint.style.display='none';draw();}
  });

  function step(dx,da){
    var c=line(sel);
    c.x=Math.max(0,Math.min(100,c.x+dx));
    c.angle=Math.max(-45,Math.min(45,c.angle+da));
    draw();syncSliders();save();
  }
  document.getElementById('bLeft').addEventListener('click',function(){step(-1,0);});
  document.getElementById('bRight').addEventListener('click',function(){step(1,0);});
  document.getElementById('bRotL').addEventListener('click',function(){step(0,-1);});
  document.getElementById('bRotR').addEventListener('click',function(){step(0,1);});

  function selectLine(k){
    sel=k;
    document.getElementById('selRed').classList.toggle('active',k==='red');
    document.getElementById('selYellow').classList.toggle('active',k==='yellow');
    syncSliders();
  }
  document.getElementById('selRed').addEventListener('click',function(){selectLine('red');});
  document.getElementById('selYellow').addEventListener('click',function(){selectLine('yellow');});

  function syncSliders(){
    var c=line(sel);
    document.getElementById('xRange').value=c.x;
    document.getElementById('aRange').value=c.angle;
    document.getElementById('wRange').value=c.w;
  }
  document.getElementById('xRange').addEventListener('input',function(){line(sel).x=+this.value;draw();saveDebounced();});
  document.getElementById('aRange').addEventListener('input',function(){line(sel).angle=+this.value;draw();saveDebounced();});
  document.getElementById('wRange').addEventListener('input',function(){line(sel).w=+this.value;draw();saveDebounced();});
  document.getElementById('rotRange').addEventListener('input',function(){rot=+this.value;applyRot();saveDebounced();});
  document.getElementById('modeSel').addEventListener('change',function(){cfg.mode=+this.value;save();});
  document.getElementById('thresh').addEventListener('change',function(){cfg.threshold=parseFloat(this.value);save();});

  ['bLeft','bRight','bRotL','bRotR','otaBtn'].forEach(function(id){
    document.getElementById(id).addEventListener('click',function(e){e.stopPropagation();});
  });
  document.getElementById('panel').addEventListener('click',function(e){e.stopPropagation();});
  var otaBtn=document.getElementById('otaBtn');
  var fileInput=document.getElementById('fileInput');
  otaBtn.addEventListener('click',function(e){
    e.stopPropagation();
    fileInput.click();   /* oeffnet den Datei-Picker (Files-App) */
  });
  fileInput.addEventListener('change',function(){
    var f=this.files[0];
    this.value='';
    if(!f)return;
    otaBtn.textContent='0%';
    var x=new XMLHttpRequest();
    x.open('POST','/update',true);
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=function(e){
      if(e.lengthComputable){otaBtn.textContent=Math.round(e.loaded/e.total*100)+'%';}
    };
    x.onload=function(){
      otaBtn.textContent='OTA';
      alert(x.responseText||'Fertig - Neustart');
    };
    x.onerror=function(){
      otaBtn.textContent='OTA';
      alert('Fehler beim Upload');
    };
    x.send(f);   /* sendet die .bin als Rohdaten an /update */
  });

  var saveT=null;
  function saveDebounced(){
    if(saveT)clearTimeout(saveT);
    saveT=setTimeout(save,600);
  }
  function save(){
    var p=cfg.portrait,l=cfg.landscape;
    var body='mode='+cfg.mode+'&threshold='+cfg.threshold+'&rot='+rot+
      '&px='+p.red.x+'&pa='+p.red.angle+'&pw='+p.red.w+'&pon='+(p.red.on?1:0)+
      '&pyx='+p.yellow.x+'&pya='+p.yellow.angle+'&pyw='+p.yellow.w+'&pyon='+(p.yellow.on?1:0)+
      '&lx='+l.red.x+'&la='+l.red.angle+'&lw='+l.red.w+'&lon='+(l.red.on?1:0)+
      '&lyx='+l.yellow.x+'&lya='+l.yellow.angle+'&lyw='+l.yellow.w+'&lyon='+(l.yellow.on?1:0);
    var x=new XMLHttpRequest();
    x.open('POST','/api/config',true);
    x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
    x.send(body);
  }

  function poll(){
    var x=new XMLHttpRequest();
    x.open('GET','/api/config',true);
    x.onload=function(){
      try{
        var j=JSON.parse(x.responseText);
        /* Version zuerst anzeigen (robust, auch wenn spaeter etwas fehlschlaegt) */
        document.getElementById('ver').textContent=(j.version||'v?.?.?')+'  Build '+(j.build||0);
        cfg.voltage=j.voltage||0;
        cfg.mode=j.mode||0;
        cfg.threshold=j.threshold||12.8;
        cfg.version=j.version||'';
        cfg.build=j.build||0;
        cfg.portrait=j.portrait||cfg.portrait;
        cfg.landscape=j.landscape||cfg.landscape;
        cfg.portrait.yellow.on=1;   /* gelbe Linie immer aktiv */
        cfg.landscape.yellow.on=1;
        if(typeof j.rot==='number'){rot=j.rot;applyRot();document.getElementById('rotRange').value=rot;}
        volt.textContent=(cfg.voltage>0?cfg.voltage.toFixed(1)+'V':'--.-V');
        document.getElementById('modeSel').value=cfg.mode;
        document.getElementById('thresh').value=cfg.threshold;
        syncSliders();
        draw();
      }catch(e){}
    };
    x.send();
  }
  setInterval(poll,2000);
  poll();
  sizeCanvas();
})();
</script>
</body>
</html>
