<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Autofrontcam</title>
<style>
:root{
  --surface:rgba(20,20,22,0.80);
  --surface-strong:rgba(20,20,22,0.94);
  --stroke:rgba(255,255,255,0.22);
  --content:#F5F5F7;
  --content-2:#D1D1D6;
  --accent:#0A84FF;
  --accent-fill:#0066CC;
  --red:#FF453A;
  --yellow:#FFD60A;
  --radius:14px;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:var(--content);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#stream{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ov{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#stage{position:fixed;inset:0;transform-origin:center center}
#ver,#volt{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:20;
  pointer-events:none;background:var(--surface);border-radius:10px;padding:6px 10px;
  text-shadow:0 1px 2px rgba(0,0,0,0.8)}
#ver{left:calc(10px + env(safe-area-inset-left));color:var(--content-2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:500}
#volt{right:calc(10px + env(safe-area-inset-right));color:var(--content);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;font-weight:600}
#hint{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  color:var(--content);font-size:15px;background:var(--surface-strong);
  padding:10px 16px;border-radius:20px;z-index:20;pointer-events:none;display:none}
#busy{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:var(--content);font-size:17px;font-weight:600;text-align:center;
  background:var(--surface-strong);padding:18px 24px;border:1px solid var(--stroke);
  border-radius:var(--radius);z-index:25;display:none;pointer-events:none;
  max-width:calc(100% - 48px)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));
  transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;
  background:var(--surface-strong);color:var(--content);padding:12px 18px;
  border-radius:var(--radius);font-size:15px;z-index:30;display:none}
#menu{position:fixed;inset:0;display:none;z-index:10}
#menu.show{display:block}
#ctrl{position:absolute;left:calc(12px + env(safe-area-inset-left));top:50%;
  transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.btn{width:56px;height:56px;font-size:24px;color:var(--content);background:var(--surface);
  border:1px solid var(--stroke);border-radius:var(--radius);display:flex;
  align-items:center;justify-content:center;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent}
.btn:active{background:var(--surface-strong)}
#panel{position:absolute;right:calc(12px + env(safe-area-inset-right));top:50%;
  transform:translateY(-50%);width:min(280px,calc(100% - 96px));
  max-height:calc(100% - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  touch-action:pan-y;background:var(--surface);border:1px solid var(--stroke);
  border-radius:18px;padding:16px;color:var(--content);font-size:15px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
#panel h3{margin:0 0 12px;font-size:17px;font-weight:600}
#panel label{display:block;margin:12px 0 4px;color:var(--content-2);font-size:14px}
#panel output{float:right;color:var(--content);font-weight:600;font-variant-numeric:tabular-nums}
#panel input[type=range]{width:100%;touch-action:pan-y}
#panel select,#panel input[type=number]{width:100%;padding:8px;border-radius:8px;
  border:1px solid var(--stroke);background:rgba(255,255,255,0.08);color:var(--content);
  font-size:16px;box-sizing:border-box}
#panel .chk{display:flex;align-items:center;gap:10px;margin-top:14px;min-height:32px}
#panel .chk label{margin:0;color:var(--content)}
#otaBtn{position:absolute;left:calc(12px + env(safe-area-inset-left));
  bottom:calc(12px + env(safe-area-inset-bottom));min-height:48px;padding:12px 20px;
  background:var(--accent-fill);color:#fff;border:none;border-radius:12px;
  font-size:17px;font-weight:600;cursor:pointer}
#otaBtn:active{filter:brightness(0.9)}
#lineSel{display:flex;gap:8px;margin-bottom:12px}
#lineSel button{flex:1;min-height:44px;padding:8px;border-radius:10px;
  border:1px solid var(--stroke);background:rgba(255,255,255,0.08);color:var(--content);
  font-size:15px;font-weight:500;cursor:pointer}
#lineSel button.active{background:var(--content);color:#000;border-color:var(--content)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (hover:hover){
  .btn:hover,#otaBtn:hover,#lineSel button:hover{filter:brightness(1.15)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
@media (prefers-reduced-transparency:reduce){
  :root{--surface:rgba(20,20,22,0.96);--surface-strong:#141416}
  #panel{-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){
  :root{--stroke:rgba(255,255,255,0.5);--content-2:#E5E5EA}
}
</style>
</head>
<body>
<div id="stage">
  <img id="stream" alt="Kamerabild">
  <canvas id="ov" role="button" tabindex="0" aria-label="Menü öffnen oder schließen"></canvas>
</div>
<div id="ver"></div>
<div id="volt">--.-V</div>
<div id="busy" role="status" aria-live="polite">⚠ Anderes Gerät<br>empfängt den Stream</div>
<div id="hint">Tippe daneben, um das Menü zu schließen</div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="menu" role="region" aria-label="Einstellungen">
  <input type="file" id="fileInput" accept=".bin" style="display:none">
  <div id="ctrl" role="group" aria-label="Linie verschieben und drehen">
    <button type="button" class="btn" id="bLeft" aria-label="Linie nach links">◀</button>
    <button type="button" class="btn" id="bRight" aria-label="Linie nach rechts">▶</button>
    <button type="button" class="btn" id="bRotL" aria-label="Gegen den Uhrzeigersinn drehen">↺</button>
    <button type="button" class="btn" id="bRotR" aria-label="Im Uhrzeigersinn drehen">↻</button>
  </div>
  <div id="panel">
    <h3>Einstellungen</h3>
    <div id="lineSel" role="group" aria-label="Linie auswählen">
      <button type="button" id="selRed" class="active" aria-pressed="true">Rot</button>
      <button type="button" id="selYellow" aria-pressed="false">Gelb</button>
    </div>
    <label for="xRange">X-Position <output id="xOut" for="xRange">50</output></label>
    <input type="range" id="xRange" min="0" max="100" step="1">
    <label for="aRange">Winkel <output id="aOut" for="aRange">0</output></label>
    <input type="range" id="aRange" min="-45" max="45" step="1">
    <label for="wRange">Dicke <output id="wOut" for="wRange">3</output></label>
    <input type="range" id="wRange" min="1" max="15" step="1">
    <label for="rotRange">Bild drehen <output id="rotOut" for="rotRange">0°</output></label>
    <input type="range" id="rotRange" min="-180" max="180" step="1">
    <label for="briRange">Helligkeit <output id="briOut" for="briRange">0</output></label>
    <input type="range" id="briRange" min="-2" max="2" step="1">
    <label for="conRange">Kontrast <output id="conOut" for="conRange">0</output></label>
    <input type="range" id="conRange" min="-2" max="2" step="1">
    <label for="satRange">Sättigung <output id="satOut" for="satRange">0</output></label>
    <input type="range" id="satRange" min="-2" max="2" step="1">
    <div class="chk">
      <input type="checkbox" id="nightChk">
      <label for="nightChk">Nachtsicht</label>
    </div>
    <label for="modeSel">Modus</label>
    <select id="modeSel">
      <option value="0">Dauerbetrieb</option>
      <option value="1">Geregelt</option>
    </select>
    <label for="thresh">Grenzwert (V)</label>
    <input type="number" id="thresh" min="6" max="14.5" step="0.1">
  </div>
  <button type="button" id="otaBtn">Update</button>
</div>

<script>
(function(){
  var img=document.getElementById('stream');
  var cv=document.getElementById('ov');
  var ctx=cv.getContext('2d');
  var stage=document.getElementById('stage');
  var volt=document.getElementById('volt');
  var menu=document.getElementById('menu');
  var hint=document.getElementById('hint');
  var busy=document.getElementById('busy');

  /* Kurze Rueckmeldung im Bild statt blockierendem alert(). */
  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg;t.style.display='block';
    clearTimeout(toast.t);
    toast.t=setTimeout(function(){t.style.display='none';},4000);
  }

  /* ===== Bilddrehung: gesamten Stage (Bild + Overlay) drehen =====
   * Winkel kommt vom Server (NVS), angewendet als CSS-Transform.
   * Touch-Koordinaten werden zurueckgedreht, damit Ziehen/Drehen der
   * Linien im ungedrehten Canvas-Koordinatensystem funktioniert. */
  var rot=0;
  function applyRot(){
    stage.style.transform='rotate('+rot+'deg)';
  }
  /* Viewport-Koordinate in Canvas-Koordinate umrechnen (Rotation rueckgaengig) */
  function toCanvas(x,y){
    if(!rot) return {x:x,y:y};
    var cx=cv.width/2, cy=cv.height/2;
    var rad=-rot*Math.PI/180;
    var dx=x-cx, dy=y-cy;
    return {x:cx+dx*Math.cos(rad)-dy*Math.sin(rad),
            y:cy+dx*Math.sin(rad)+dy*Math.cos(rad)};
  }

  /* ===== Stream-Client =====
   * iOS Safari rendert multipart/x-mixed-replace im <img> nicht zuverlaessig.
   * Daher holt die Web-UI Einzelbilder per /capture vom gleichen Server
   * (Port 80, gleicher Origin -> kein CORS, kein Blocking). ~8-10 fps. */
  var streamBusy=false;
  var streamXHR=null;
  var streamTimer=null;
  var lastUrl=null;
  var streamLastOk=0;
  var streamStarted=Date.now();
  var otherDevice=false;

  function showFrame(blob){
    if(lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl=URL.createObjectURL(blob);
    img.src=lastUrl;
  }

  function pollFrame(){
    if(streamBusy) return;      /* laufender Request -> nicht stapeln */
    streamBusy=true;
    var x=new XMLHttpRequest();
    streamXHR=x;
    /* Cache-Busting, damit iOS nicht die alte Antwort liefert */
    x.open('GET','/capture?r='+Date.now(),true);   /* gleicher Server (Port 80) */
    x.responseType='blob';
    x.timeout=4000;
    x.onloadend=function(){     /* feuert IMMER (Erfolg/Fehler/Timeout) */
      streamBusy=false;
      streamXHR=null;
      if(x.status===200&&x.response&&x.response.size>0){
        streamLastOk=Date.now();
        otherDevice=false;
        busy.style.display='none';
        showFrame(x.response);
      } else if(x.status===503){
        otherDevice=true;   /* anderes Geraet bedient den Stream */
        busy.innerHTML='⚠ Anderes Gerät<br>empfängt den Stream';
        busy.style.display='block';
      }
      schedule();
    };
    x.send();
  }

  function schedule(){
    clearTimeout(streamTimer);
    streamTimer=setTimeout(pollFrame,200);   /* ~5fps reichen fuer die Fahrzeugkante */
  }

  /* Watchdog: falls die Kette irgendwo haengt (z.B. iOS stoppt onloadend),
   * den Request abbrechen und neu starten. */
  setInterval(function(){
    if(Date.now()-streamLastOk>5000){
      if(streamXHR){ try{streamXHR.abort();}catch(e){} }
      if(streamBusy) streamBusy=false;
      clearTimeout(streamTimer);
      schedule();
      if(Date.now()-streamStarted>7000&&!otherDevice){
        busy.textContent='⚠ Keine Verbindung zur Kamera';
        busy.style.display='block';
      }
    }
  },2000);

  pollFrame();

  var cfg={voltage:0,mode:0,threshold:12.8,version:'',build:0,rot:0,bri:0,con:0,sat:0,night:0,
    portrait:{red:{x:50,angle:0,w:3,on:1},yellow:{x:60,angle:0,w:3,on:1}},
    landscape:{red:{x:50,angle:0,w:3,on:1},yellow:{x:60,angle:0,w:3,on:1}}};
  var sel='red';
  var drag=null;

  function isPortrait(){return window.innerHeight>window.innerWidth;}
  function activeSet(){return isPortrait()?cfg.portrait:cfg.landscape;}
  function line(c){return activeSet()[c];}

  function sizeCanvas(){
    cv.width=img.clientWidth;
    cv.height=img.clientHeight;
    draw();
  }
  window.addEventListener('resize',function(){sizeCanvas();syncSliders();});
  window.addEventListener('orientationchange',function(){
    setTimeout(function(){sizeCanvas();syncSliders();},300);
  });

  function draw(){
    var w=cv.width,h=cv.height;
    if(!w||!h)return;
    ctx.clearRect(0,0,w,h);
    var s=activeSet();
    drawOne(s.red,'#ff2a2a');
    drawOne(s.yellow,'#ffe600');
  }
  function drawOne(c,a){
    if(!c.on)return;
    var w=cv.width,h=cv.height;
    var cx=c.x/100*w, cy=h/2;
    var rad=c.angle*Math.PI/180, half=h/2;
    var x1=cx+half*Math.sin(rad), y1=cy-half*Math.cos(rad);
    var x2=cx-half*Math.sin(rad), y2=cy+half*Math.cos(rad);
    ctx.strokeStyle=a;ctx.lineWidth=c.w;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if(menu.classList.contains('show')){
      var r=Math.max(8,c.w+5);
      ctx.fillStyle=a;
      ctx.beginPath();ctx.arc(x1,y1,r,0,6.2832);ctx.fill();
      ctx.beginPath();ctx.arc(x2,y2,r,0,6.2832);ctx.fill();
    }
  }

  function lineEnds(c){
    var w=cv.width,h=cv.height;
    var cx=c.x/100*w, cy=h/2, rad=c.angle*Math.PI/180, half=h/2;
    return {x1:cx+half*Math.sin(rad),y1:cy-half*Math.cos(rad),
            x2:cx-half*Math.sin(rad),y2:cy+half*Math.cos(rad)};
  }
  function distToLine(c,x,y){
    var e=lineEnds(c);
    var dx=e.x2-e.x1,dy=e.y2-e.y1;
    var t=((x-e.x1)*dx+(y-e.y1)*dy)/(dx*dx+dy*dy);
    t=Math.max(0,Math.min(1,t));
    return Math.hypot(x-(e.x1+t*dx),y-(e.y1+t*dy));
  }

  function onStart(x,y){
    if(!menu.classList.contains('show'))return;
    var cand=[];
    ['red','yellow'].forEach(function(k){
      var c=line(k);
      if(!c.on)return;
      var e=lineEnds(c);
      if(Math.hypot(x-e.x1,y-e.y1)<30)cand.push({line:k,type:'rot'});
      else if(distToLine(c,x,y)<24)cand.push({line:k,type:'move'});
    });
    if(cand.length){
      drag=cand[0];
      drag.startX=x;drag.startY=y;
      drag.startCx=line(drag.line).x;
      drag.startAngle=line(drag.line).angle;
    }
  }
  function onMove(x,y){
    if(!drag)return;
    var c=line(drag.line);
    if(drag.type==='move'){
      var dx=(x-drag.startX)/cv.width*100;
      c.x=Math.max(0,Math.min(100,drag.startCx+dx));
    }else{
      var e=lineEnds(c);
      var ang=Math.atan2(y-e.y1,x-e.x1)*180/Math.PI-90;
      c.angle=Math.max(-45,Math.min(45,ang));
    }
    draw();syncSliders();saveDebounced();
  }
  function onEnd(){
    if(drag){drag=null;save();}
  }

  var touchMoved=false;
  cv.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];var p=toCanvas(t.clientX,t.clientY);onStart(p.x,p.y);touchMoved=false;},{passive:false});
  cv.addEventListener('touchmove',function(e){e.preventDefault();touchMoved=true;var t=e.touches[0];var p=toCanvas(t.clientX,t.clientY);onMove(p.x,p.y);},{passive:false});
  cv.addEventListener('touchend',function(e){e.preventDefault();var wasDrag=!!drag;onEnd();if(!wasDrag&&!touchMoved){onTap();}},{passive:false});
  cv.addEventListener('touchcancel',function(e){e.preventDefault();onEnd();},{passive:false});
  cv.addEventListener('mousedown',function(e){var p=toCanvas(e.clientX,e.clientY);onStart(p.x,p.y);});
  window.addEventListener('mousemove',function(e){if(drag){var p=toCanvas(e.clientX,e.clientY);onMove(p.x,p.y);}});
  window.addEventListener('mouseup',onEnd);

  function onTap(){
    if(drag)return;
    if(menu.classList.contains('show')){
      menu.classList.remove('show');hint.style.display='none';
    }else{
      menu.classList.add('show');
      hint.style.display='block';
      setTimeout(function(){hint.style.display='none';},2500);
    }
    draw();
  }
  cv.addEventListener('click',function(e){e.preventDefault();onTap();});
  cv.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();onTap();}
  });
  /* Menü schliessen bei Tipp auf freie Stelle (nicht Button/Panel) */
  menu.addEventListener('click',function(e){
    if(e.target===menu){menu.classList.remove('show');hint.style.display='none';draw();}
  });

  function step(dx,da){
    var c=line(sel);
    c.x=Math.max(0,Math.min(100,c.x+dx));
    c.angle=Math.max(-45,Math.min(45,c.angle+da));
    draw();syncSliders();save();
  }
  document.getElementById('bLeft').addEventListener('click',function(){step(-1,0);});
  document.getElementById('bRight').addEventListener('click',function(){step(1,0);});
  document.getElementById('bRotL').addEventListener('click',function(){step(0,-1);});
  document.getElementById('bRotR').addEventListener('click',function(){step(0,1);});

  function selectLine(k){
    sel=k;
    document.getElementById('selRed').classList.toggle('active',k==='red');
    document.getElementById('selYellow').classList.toggle('active',k==='yellow');
    document.getElementById('selRed').setAttribute('aria-pressed',k==='red');
    document.getElementById('selYellow').setAttribute('aria-pressed',k==='yellow');
    syncSliders();
  }
  document.getElementById('selRed').addEventListener('click',function(){selectLine('red');});
  document.getElementById('selYellow').addEventListener('click',function(){selectLine('yellow');});

  function setOut(id,v){var e=document.getElementById(id);if(e)e.value=v;}
  function syncOutputs(){
    var c=line(sel);
    setOut('xOut',c.x);setOut('aOut',c.angle);setOut('wOut',c.w);
    setOut('rotOut',Math.round(rot)+'°');
    setOut('briOut',cfg.bri);setOut('conOut',cfg.con);setOut('satOut',cfg.sat);
  }
  function syncSliders(){
    var c=line(sel);
    document.getElementById('xRange').value=c.x;
    document.getElementById('aRange').value=c.angle;
    document.getElementById('wRange').value=c.w;
    syncOutputs();
  }
  document.getElementById('xRange').addEventListener('input',function(){line(sel).x=+this.value;draw();syncOutputs();saveDebounced();});
  document.getElementById('aRange').addEventListener('input',function(){line(sel).angle=+this.value;draw();syncOutputs();saveDebounced();});
  document.getElementById('wRange').addEventListener('input',function(){line(sel).w=+this.value;draw();syncOutputs();saveDebounced();});
  document.getElementById('rotRange').addEventListener('input',function(){rot=+this.value;applyRot();syncOutputs();saveDebounced();});
  document.getElementById('briRange').addEventListener('input',function(){cfg.bri=+this.value;syncOutputs();saveDebounced();});
  document.getElementById('conRange').addEventListener('input',function(){cfg.con=+this.value;syncOutputs();saveDebounced();});
  document.getElementById('satRange').addEventListener('input',function(){cfg.sat=+this.value;syncOutputs();saveDebounced();});
  document.getElementById('nightChk').addEventListener('change',function(){cfg.night=this.checked?1:0;save();});
  document.getElementById('modeSel').addEventListener('change',function(){cfg.mode=+this.value;save();});
  document.getElementById('thresh').addEventListener('change',function(){cfg.threshold=parseFloat(this.value);save();});

  ['bLeft','bRight','bRotL','bRotR','otaBtn'].forEach(function(id){
    document.getElementById(id).addEventListener('click',function(e){e.stopPropagation();});
  });
  document.getElementById('panel').addEventListener('click',function(e){e.stopPropagation();});
  var otaBtn=document.getElementById('otaBtn');
  var fileInput=document.getElementById('fileInput');
  otaBtn.addEventListener('click',function(e){
    e.stopPropagation();
    fileInput.click();   /* oeffnet den Datei-Picker (Files-App) */
  });
  fileInput.addEventListener('change',function(){
    var f=this.files[0];
    this.value='';
    if(!f)return;
    otaBtn.textContent='Update 0 %';
    var x=new XMLHttpRequest();
    x.open('POST','/update',true);
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=function(e){
      if(e.lengthComputable){otaBtn.textContent='Update '+Math.round(e.loaded/e.total*100)+' %';}
    };
    x.onload=function(){
      otaBtn.textContent='Update';
      toast(x.status===200?'Update übertragen. Die Kamera startet neu.'
        :'Update fehlgeschlagen ('+x.status+'). Verbindung prüfen und erneut versuchen.');
    };
    x.onerror=function(){
      otaBtn.textContent='Update';
      toast('Update fehlgeschlagen. Verbindung prüfen und erneut versuchen.');
    };
    x.send(f);   /* sendet die .bin als Rohdaten an /update */
  });

  var saveT=null;
  function saveDebounced(){
    if(saveT)clearTimeout(saveT);
    saveT=setTimeout(save,600);
  }
  function save(){
    var p=cfg.portrait,l=cfg.landscape;
    var body='mode='+cfg.mode+'&threshold='+cfg.threshold+'&rot='+rot+
      '&bri='+cfg.bri+'&con='+cfg.con+'&sat='+cfg.sat+'&night='+cfg.night+
      '&px='+p.red.x+'&pa='+p.red.angle+'&pw='+p.red.w+'&pon='+(p.red.on?1:0)+
      '&pyx='+p.yellow.x+'&pya='+p.yellow.angle+'&pyw='+p.yellow.w+'&pyon='+(p.yellow.on?1:0)+
      '&lx='+l.red.x+'&la='+l.red.angle+'&lw='+l.red.w+'&lon='+(l.red.on?1:0)+
      '&lyx='+l.yellow.x+'&lya='+l.yellow.angle+'&lyw='+l.yellow.w+'&lyon='+(l.yellow.on?1:0);
    var x=new XMLHttpRequest();
    x.open('POST','/api/config',true);
    x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
    x.send(body);
  }

  function poll(){
    var x=new XMLHttpRequest();
    x.open('GET','/api/config',true);
    x.onload=function(){
      try{
        var j=JSON.parse(x.responseText);
        /* Version zuerst anzeigen (robust, auch wenn spaeter etwas fehlschlaegt) */
        document.getElementById('ver').textContent=(j.version||'v?.?.?')+'  Build '+(j.build||0);
        cfg.voltage=j.voltage||0;
        cfg.mode=j.mode||0;
        cfg.threshold=j.threshold||12.8;
        cfg.version=j.version||'';
        cfg.build=j.build||0;
        cfg.bri=j.bri||0;
        cfg.con=j.con||0;
        cfg.sat=j.sat||0;
        cfg.night=j.night||0;
        cfg.portrait=j.portrait||cfg.portrait;
        cfg.landscape=j.landscape||cfg.landscape;
        cfg.portrait.yellow.on=1;   /* gelbe Linie immer aktiv */
        cfg.landscape.yellow.on=1;
        if(typeof j.rot==='number'){rot=j.rot;applyRot();document.getElementById('rotRange').value=rot;}
        document.getElementById('briRange').value=cfg.bri;
        document.getElementById('conRange').value=cfg.con;
        document.getElementById('satRange').value=cfg.sat;
        document.getElementById('nightChk').checked=cfg.night?true:false;
        volt.textContent=(cfg.voltage>0?cfg.voltage.toFixed(1)+'V':'--.-V');
        document.getElementById('modeSel').value=cfg.mode;
        document.getElementById('thresh').value=cfg.threshold;
        syncSliders();
        draw();
      }catch(e){}
    };
    x.send();
  }
  setInterval(poll,2000);
  poll();
  sizeCanvas();
})();
</script>
</body>
</html>
